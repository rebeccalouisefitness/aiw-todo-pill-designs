<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today's Schedule — notification bell</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#FBF8F3;font-family:Inter,system-ui,sans-serif;color:#0D2842}
header{padding:22px 16px 6px;text-align:center}h1{font-size:18px;margin:0 0 4px;font-weight:800}
header p{margin:0;font-size:13px;color:#6b7280}
.wrap{display:flex;justify-content:center;padding:18px 16px 40px}
.col{width:358px;max-width:100%}
.card{position:relative;background:#fff;border:1px solid #E8E1D4;border-radius:18px}
.head{display:flex;align-items:flex-start;gap:10px;padding:15px 16px 14px;cursor:pointer;user-select:none;border-radius:18px}
.head:active{background:#faf7f2}
.main{flex:1;min-width:0}
.kick{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#0D2842;line-height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-weight:800;font-size:11.5px}
.chip svg{width:12px;height:12px}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.bell{position:relative;width:24px;height:24px;display:block}
.bell svg{width:24px;height:24px;display:block}
.badge{position:absolute;top:-6px;left:13px;min-width:20px;height:18px;padding:0 5px;border-radius:999px;background:#5A8FB0;color:#fff;font-size:10.5px;font-weight:800;line-height:18px;text-align:center;border:2px solid #fff;box-sizing:content-box;font-variant-numeric:tabular-nums}
.chev{width:16px;height:16px;transition:transform .2s}
.open .chev{transform:rotate(180deg)}.open .chips{display:none}
.body{display:none;border-top:1px solid #F1ECE3;padding:12px 16px;font-size:13px;color:#6b7280}.open .body{display:block}
</style></head><body>
<header><h1>Today's Schedule — notification bell</h1><p>Bell in the top-right corner with the count on it · tap the card to open/close</p></header>
<div class="wrap"><div class="col">
<div class="card" id="card"><div class="head" onclick="card.classList.toggle('open')">
<div class="main"><div class="kick">TODAY'S SCHEDULE</div>
<div class="chips">
<span class="chip" style="background:#F4EADC;color:#A9764E"><svg viewBox="0 0 24 24" fill="none" stroke="#A67C46" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>9</span>
<span class="chip" style="background:#E7EFE6;color:#5A7A5E"><svg viewBox="0 0 24 24" fill="none" stroke="#5A7A5E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>2</span>
<span class="chip" style="background:#F4EADC;color:#A9764E"><svg viewBox="0 0 24 24" fill="none" stroke="#C8956C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>59</span>
</div></div>
<div class="side">
<span class="bell" aria-label="70 to do"><svg viewBox="0 0 24 24" fill="none" stroke="#0D2842" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" id="n"></span></span>
<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#C8956C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</div></div>
<div class="body">…schedule rows open here exactly as now (Customer follow up, Messages, Lead follow-ups, Calls)…</div></div>
</div></div>
<script>const count=70;document.getElementById('n').textContent=count>99?'99+':count;</script>
</body></html>
