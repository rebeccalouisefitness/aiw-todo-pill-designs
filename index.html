<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today's Schedule — blue "to do" pill · 3 options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#FBF8F3;font-family:Inter,system-ui,sans-serif;color:#0D2842}
header{padding:22px 16px 6px;text-align:center}h1{font-size:18px;margin:0 0 4px;font-weight:800}
header p{margin:0;font-size:13px;color:#6b7280}
.grid{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;padding:18px 12px 40px}
.col{width:358px;max-width:100%}
.lab{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#C8956C;margin:0 4px 8px}
.lab small{display:block;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:#6b7280;margin-top:3px}
.card{background:#fff;border:1px solid #E8E1D4;border-radius:18px;overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:15px 16px 14px;cursor:pointer;user-select:none}
.head:active{background:#faf7f2}
.main{flex:1;min-width:0}
.kick{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#0D2842;display:flex;align-items:center;gap:8px;white-space:nowrap}
.old{color:#F26B1D}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-weight:800;font-size:11.5px}
.chip svg{width:12px;height:12px}
.chev{width:16px;height:16px;flex:none;transition:transform .2s}
.open .chev{transform:rotate(180deg)}.open .chips{display:none}
.body{display:none;border-top:1px solid #F1ECE3;padding:12px 16px;font-size:13px;color:#6b7280}.open .body{display:block}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-weight:800;letter-spacing:0;text-transform:none}
.pill svg{width:13px;height:13px;flex:none}
.pA{background:#E6EFF4;color:#5A8FB0;padding:3px 9px 3px 7px;font-size:12px}
.pB{background:#5A8FB0;color:#fff;padding:5px 11px 5px 8px;font-size:13px;box-shadow:0 1px 2px rgba(90,143,176,.35)}
.pC{background:#E6EFF4;color:#3F7398;border:1px solid #C9DCE8;padding:3px 10px 3px 7px;font-size:11.5px}
.pC b{font-weight:600;color:#5A8FB0}
</style></head><body>
<header><h1>Today's Schedule — the "70 to do" as a blue pill</h1><p>Design only · tap any card to open/close it · everything else unchanged</p></header>
<div class="grid" id="g"></div>
<script>
const alertIco=c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5"/><path d="M12 16.6v.01"/></svg>`;
const chev=`<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#C8956C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
const chips=`<div class="chips">
<span class="chip" style="background:#F4EADC;color:#A9764E"><svg viewBox="0 0 24 24" fill="none" stroke="#A67C46" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>9</span>
<span class="chip" style="background:#E7EFE6;color:#5A7A5E"><svg viewBox="0 0 24 24" fill="none" stroke="#5A7A5E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>2</span>
<span class="chip" style="background:#F4EADC;color:#A9764E"><svg viewBox="0 0 24 24" fill="none" stroke="#C8956C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>59</span></div>`;
const opts=[
 {lab:'Today (for reference)',sub:'Orange "70 to do" text',k:`TODAY'S SCHEDULE · <span class="old">70 TO DO</span>`},
 {lab:'Option A — soft pill next to the title',sub:'Pale blue fill, blue alert icon + 70',k:`TODAY'S SCHEDULE <span class="pill pA">${alertIco('#5A8FB0')}70</span>`},
 {lab:'Option B — solid blue pill by the arrow',sub:'Boldest: white alert icon + 70 on blue, right side',right:`<span class="pill pB">${alertIco('#fff')}70</span>`,k:`TODAY'S SCHEDULE`},
 {lab:'Option C — soft pill with words',sub:'Pale blue, fine outline: alert icon + "70 to do"',k:`TODAY'S SCHEDULE <span class="pill pC">${alertIco('#5A8FB0')}70 <b>to do</b></span>`},
];
document.getElementById('g').innerHTML=opts.map(o=>`<div class="col"><div class="lab">${o.lab}<small>${o.sub}</small></div>
<div class="card"><div class="head" onclick="this.parentNode.classList.toggle('open')"><div class="main"><div class="kick">${o.k}</div>${chips}</div>${o.right||''}${chev}</div>
<div class="body">…schedule rows open here exactly as now (Customer follow up, Messages, Lead follow-ups, Calls)…</div></div></div>`).join('');
</script></body></html>
